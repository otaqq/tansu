[tools]
node = "26"

# PHP runs in a container so the host needs nothing but Docker
[tasks."php:image"]
run = "docker build -q -t tansu-php tests/php >/dev/null"

[tasks.composer]
depends = ["php:image"]
run = "docker run --rm -u $(id -u):$(id -g) -v $PWD:/app tansu-php composer"

[tasks.php]
depends = ["php:image"]
run = "docker run --rm -u $(id -u):$(id -g) -v $PWD:/app tansu-php php"

[tasks."test:php"]
depends = ["php:image"]
run = "docker run --rm -u $(id -u):$(id -g) -v $PWD:/app tansu-php vendor/bin/phpunit"

[tasks."test:ui"]
run = "node --test ui/test/"

[tasks.test]
depends = ["test:php", "test:ui"]
