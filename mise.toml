[tools]
node = "26"

# PHP runs in a container so the host needs nothing but Docker
[tasks.composer]
run = "docker run --rm -it -u $(id -u):$(id -g) -e COMPOSER_HOME=/tmp/composer -v $PWD:/app -w /app composer:2"

[tasks."test:php"]
run = "docker run --rm -u $(id -u):$(id -g) -v $PWD:/app -w /app composer:2 vendor/bin/phpunit"
